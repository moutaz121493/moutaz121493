<svg xmlns="http://www.w3.org/2000/svg" width="640" height="692" viewBox="0 0 640 692" role="img" aria-label="Thesis trace, cross-lingual RAG: ask --lang ar: question in Arabic about a German document; route: documents (numeric questions go to predefined, parameterised queries, never free SQL); retrieve --keyword: exact names and invoice numbers; retrieve --vector: multilingual embeddings, run locally: documents never leave the house; fuse --rrf: reciprocal rank fusion -&gt; top-k passages; answer --cite: answer in Arabic, with sources; eval: Recall@k · MRR · faithfulness · latency · cost per question"><style>@font-face{font-family:JM;font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}.s{display:none}@media (prefers-reduced-motion:reduce){.m{display:none}.s{display:inline}}</style><defs></defs><rect x=".75" y=".75" width="638.5" height="690.5" rx="18" fill="#ebe2cc" stroke="#b4a07a" stroke-width="1.5"/><line x1="1" y1="56" x2="639" y2="56" stroke="#b4a07a"/><circle cx="28" cy="29" r="7" fill="#b3261e" opacity=".75"/><circle cx="50" cy="29" r="7" fill="#d24f1b" opacity=".75"/><circle cx="72" cy="29" r="7" fill="#3d7a1f" opacity=".75"/><text x="614.0" y="36.0" font-family="JM,ui-monospace,Menlo,Consolas,monospace" font-size="17" fill="#9f3c14" text-anchor="end" letter-spacing="2">// THESIS TRACE</text><text x="30.0" y="92.0" font-family="JM,ui-monospace,Menlo,Consolas,monospace" font-size="20" fill="#231a11">$ ask --lang ar &quot;«question in Arabic»&quot;</text><text x="30.0" y="122.0" font-family="JM,ui-monospace,Menlo,Consolas,monospace" font-size="17" fill="#6a5842">→ question in Arabic about a German document</text><text x="30.0" y="162.0" font-family="JM,ui-monospace,Menlo,Consolas,monospace" font-size="20" fill="#231a11">$ route</text><text x="30.0" y="192.0" font-family="JM,ui-monospace,Menlo,Consolas,monospace" font-size="17" fill="#6a5842">→ documents (numeric questions go to</text><text x="30.0" y="218.0" font-family="JM,ui-monospace,Menlo,Consolas,monospace" font-size="17" fill="#6a5842">  predefined, parameterised queries, never</text><text x="30.0" y="244.0" font-family="JM,ui-monospace,Menlo,Consolas,monospace" font-size="17" fill="#6a5842">  free SQL)</text><text x="30.0" y="284.0" font-family="JM,ui-monospace,Menlo,Consolas,monospace" font-size="20" fill="#231a11">$ retrieve --keyword</text><text x="30.0" y="314.0" font-family="JM,ui-monospace,Menlo,Consolas,monospace" font-size="17" fill="#6a5842">→ exact names and invoice numbers</text><text x="30.0" y="354.0" font-family="JM,ui-monospace,Menlo,Consolas,monospace" font-size="20" fill="#231a11">$ retrieve --vector</text><text x="30.0" y="384.0" font-family="JM,ui-monospace,Menlo,Consolas,monospace" font-size="17" fill="#6a5842">→ multilingual embeddings, run locally:</text><text x="30.0" y="410.0" font-family="JM,ui-monospace,Menlo,Consolas,monospace" font-size="17" fill="#6a5842">  documents never leave the house</text><text x="30.0" y="450.0" font-family="JM,ui-monospace,Menlo,Consolas,monospace" font-size="20" fill="#231a11">$ fuse --rrf</text><text x="30.0" y="480.0" font-family="JM,ui-monospace,Menlo,Consolas,monospace" font-size="17" fill="#6a5842">→ reciprocal rank fusion -&gt; top-k passages</text><text x="30.0" y="520.0" font-family="JM,ui-monospace,Menlo,Consolas,monospace" font-size="20" fill="#231a11">$ answer --cite</text><text x="30.0" y="550.0" font-family="JM,ui-monospace,Menlo,Consolas,monospace" font-size="17" fill="#6a5842">→ answer in Arabic, with sources</text><text x="30.0" y="590.0" font-family="JM,ui-monospace,Menlo,Consolas,monospace" font-size="20" fill="#231a11">$ eval</text><text x="30.0" y="620.0" font-family="JM,ui-monospace,Menlo,Consolas,monospace" font-size="17" fill="#34681a">→ Recall@k · MRR · faithfulness · latency ·</text><text x="30.0" y="646.0" font-family="JM,ui-monospace,Menlo,Consolas,monospace" font-size="17" fill="#6a5842">  cost per question</text></svg>