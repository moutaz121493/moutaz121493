name: contrib
# Daily: 3D contribution skyline (yoshi389111/github-profile-3d-contrib) in the profile palette, dark + light.
on:
  schedule:
    - cron: "45 4 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: contrib
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: yoshi389111/github-profile-3d-contrib@7d95e7d4cdc028dd1e1cbd957d65f35efb12ae39 # v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          SETTING_JSON: data/skyline-dark.json
      - uses: yoshi389111/github-profile-3d-contrib@7d95e7d4cdc028dd1e1cbd957d65f35efb12ae39 # v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          SETTING_JSON: data/skyline-light.json
      - name: commit
        run: |
          mv profile-3d-contrib/skyline-dark.svg profile-3d-contrib/skyline-light.svg assets/
          rm -rf profile-3d-contrib
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/skyline-*.svg
          git diff --cached --quiet || (git commit -m "chore(contrib): daily skyline [skip ci]" && for i in 1 2 3 4 5; do git pull --rebase -q origin main && git push && break; sleep $((i * 4)); done)
